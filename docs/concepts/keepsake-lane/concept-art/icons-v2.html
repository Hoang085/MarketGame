<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keepsake Lane icon</title>
<style>
  body { margin:0; padding:16px; background:#c9a873; font-family:sans-serif; color:#3a2a1c; }
  h2 { margin:8px 0; font-size:16px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .tile { width:120px; height:120px; border-radius:16px; background:#f6ead0; box-shadow:inset 0 -4px 0 #e0cfa8;
          display:flex; align-items:center; justify-content:center; position:relative; }
  .tile img { width:92%; height:92%; object-fit:contain; mix-blend-mode:multiply; }
  .tile b { position:absolute; top:4px; left:8px; font-size:12px; opacity:.6; }
</style>
</head>
<body>
<h2>Chuỗi đồng hồ CLK-1 → CLK-6 (Recraft, digital_illustration)</h2>
<div class="row">
  <div class="tile"><b>1</b><img src="icons-v2/CLK-1.webp"></div>
  <div class="tile"><b>2</b><img src="icons-v2/CLK-2.webp"></div>
  <div class="tile"><b>3</b><img src="icons-v2/CLK-3.webp"></div>
  <div class="tile"><b>4</b><img src="icons-v2/CLK-4.webp"></div>
  <div class="tile"><b>5</b><img src="icons-v2/CLK-5.webp"></div>
  <div class="tile"><b>6</b><img src="icons-v2/CLK-6.webp"></div>
</div>
<h2>Máy sinh đồ + bản vector để so</h2>
<div class="row">
  <div class="tile"><b>GEN</b><img src="icons-v2/GEN-TIN.webp"></div>
  <div class="tile"><b>6v</b><img src="icons-v2/CLK-6-vector.svg"></div>
</div>
</body>
</html>

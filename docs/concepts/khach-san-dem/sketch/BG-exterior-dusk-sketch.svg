<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a7d6"/>
      <stop offset="0.55" stop-color="#f3c6a5"/>
      <stop offset="1" stop-color="#f7d9b8"/>
    </linearGradient>
    <pattern id="boards" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#a07850"/><line x1="0" y1="5" x2="10" y2="5" stroke="#6b4a2c" stroke-width="2"/>
    </pattern>
  </defs>
  <style>
    .wall{fill:#7fa3a0;stroke:#2f3b3a;stroke-width:2}
    .trim{fill:#efe4cf;stroke:#2f3b3a;stroke-width:1.5}
    .roof{fill:#8a5a52;stroke:#2f3b3a;stroke-width:2}
    .win{fill:#3b4a55;stroke:#efe4cf;stroke-width:2}
    .winlit{fill:#f2c66d;stroke:#efe4cf;stroke-width:2}
    .board{fill:url(#boards);stroke:#efe4cf;stroke-width:2}
    .lbl{font-size:13px;fill:#1d1d1d;font-weight:bold}
    .note{font-size:11px;fill:#333}
    .tag{fill:#fffbe6;stroke:#c0392b;stroke-width:1.5}
    .lead{stroke:#c0392b;stroke-width:1.5;fill:none}
    .zone{fill:rgba(52,152,219,0.18);stroke:#2c7fb8;stroke-width:2;stroke-dasharray:8 5}
  </style>

  <!-- trời -->
  <rect width="540" height="960" fill="url(#sky)"/>
  <circle cx="455" cy="70" r="22" fill="#fff4d6" opacity="0.8"/>

  <!-- thân khách sạn: 5 tầng, đối xứng -->
  <!-- tháp góc trái -->
  <rect class="wall" x="40" y="215" width="80" height="420"/>
  <polygon class="roof" points="30,218 80,120 130,218"/>
  <!-- tháp góc phải -->
  <rect class="wall" x="420" y="215" width="80" height="420"/>
  <polygon class="roof" points="410,218 460,120 510,218"/>
  <!-- thân giữa -->
  <rect class="wall" x="120" y="250" width="300" height="385"/>
  <polygon class="roof" points="110,253 270,175 430,253"/>
  <!-- mái hiên tầng -->
  <rect class="trim" x="118" y="250" width="304" height="8"/>

  <!-- biển HOTEL trên nóc, nghiêng, mất chữ -->
  <g transform="rotate(-7 270 165)">
    <line x1="215" y1="185" x2="215" y2="150" stroke="#2f3b3a" stroke-width="3"/>
    <line x1="325" y1="185" x2="325" y2="150" stroke="#2f3b3a" stroke-width="3"/>
    <rect x="200" y="120" width="140" height="40" fill="#3d2f2a" stroke="#c9a14a" stroke-width="3"/>
    <text x="270" y="150" text-anchor="middle" font-size="28" font-weight="bold" fill="#8c7a5a" letter-spacing="6">H&#160;&#160;TEL</text>
  </g>

  <!-- 4 hàng cửa sổ giống nhau ở thân giữa (tầng 2-5) -->
  <g>
    <!-- hàng y: 275, 340, 405, 470 -->
    <rect class="win" x="140" y="275" width="30" height="42"/><rect class="win" x="190" y="275" width="30" height="42"/><rect class="winlit" x="255" y="275" width="30" height="42"/><rect class="win" x="320" y="275" width="30" height="42"/><rect class="board" x="370" y="275" width="30" height="42"/>
    <rect class="board" x="140" y="340" width="30" height="42"/><rect class="win" x="190" y="340" width="30" height="42"/><rect class="win" x="255" y="340" width="30" height="42"/><rect class="win" x="320" y="340" width="30" height="42"/><rect class="win" x="370" y="340" width="30" height="42"/>
    <rect class="win" x="140" y="405" width="30" height="42"/><rect class="board" x="190" y="405" width="30" height="42"/><rect class="win" x="255" y="405" width="30" height="42"/><rect class="win" x="320" y="405" width="30" height="42"/><rect class="win" x="370" y="405" width="30" height="42"/>
    <rect class="win" x="140" y="470" width="30" height="42"/><rect class="win" x="190" y="470" width="30" height="42"/><rect class="win" x="255" y="470" width="30" height="42"/><rect class="board" x="320" y="470" width="30" height="42"/><rect class="win" x="370" y="470" width="30" height="42"/>
    <!-- ban công nhỏ -->
    <rect class="trim" x="250" y="318" width="40" height="6"/><rect class="trim" x="250" y="383" width="40" height="6"/><rect class="trim" x="250" y="448" width="40" height="6"/>
    <!-- cửa sổ tháp -->
    <rect class="win" x="65" y="240" width="30" height="40"/><rect class="win" x="65" y="310" width="30" height="40"/><rect class="board" x="65" y="380" width="30" height="40"/><rect class="win" x="65" y="450" width="30" height="40"/>
    <rect class="win" x="445" y="240" width="30" height="40"/><rect class="board" x="445" y="310" width="30" height="40"/><rect class="win" x="445" y="380" width="30" height="40"/><rect class="win" x="445" y="450" width="30" height="40"/>
  </g>

  <!-- tầng trệt + hiên hàng cột dài -->
  <rect class="trim" x="30" y="528" width="480" height="10"/>
  <g stroke="#2f3b3a" stroke-width="2" fill="#efe4cf">
    <rect x="50" y="538" width="8" height="97"/><rect x="110" y="538" width="8" height="97"/><rect x="170" y="538" width="8" height="97"/>
    <rect x="362" y="538" width="8" height="97"/><rect x="422" y="538" width="8" height="97"/><rect x="482" y="538" width="8" height="97"/>
  </g>
  <!-- cửa sổ tầng trệt -->
  <rect class="win" x="70" y="560" width="30" height="55"/><rect class="board" x="130" y="560" width="30" height="55"/>
  <rect class="win" x="380" y="560" width="30" height="55"/><rect class="win" x="440" y="560" width="30" height="55"/>

  <!-- lối vào lớn: cửa kép + mái che nhô ra -->
  <rect x="220" y="555" width="100" height="80" fill="#5b3a26" stroke="#2f3b3a" stroke-width="2"/>
  <line x1="270" y1="555" x2="270" y2="635" stroke="#2f3b3a" stroke-width="2"/>
  <polygon points="195,548 345,548 360,530 180,530" fill="#7a2b2b" stroke="#2f3b3a" stroke-width="2"/>
  <path d="M 200 548 L 215 560 L 230 548" fill="#7a2b2b" stroke="#2f3b3a" stroke-width="1.5"/>
  <!-- bậc thềm -->
  <rect x="200" y="635" width="140" height="10" fill="#cfc6b8" stroke="#2f3b3a"/>
  <rect x="185" y="645" width="170" height="10" fill="#cfc6b8" stroke="#2f3b3a"/>
  <rect x="170" y="655" width="200" height="10" fill="#cfc6b8" stroke="#2f3b3a"/>
  <!-- đèn cột 2 bên -->
  <line x1="165" y1="665" x2="165" y2="590" stroke="#2f3b3a" stroke-width="4"/><circle cx="165" cy="585" r="8" fill="#555"/>
  <line x1="375" y1="665" x2="375" y2="590" stroke="#2f3b3a" stroke-width="4"/><circle cx="375" cy="585" r="8" fill="#555"/>

  <!-- dây leo -->
  <path d="M 500 635 C 480 560 510 500 485 430 C 470 380 500 330 478 270" stroke="#4f6b3a" stroke-width="7" fill="none" opacity="0.85"/>
  <path d="M 40 635 C 55 590 35 560 50 520" stroke="#4f6b3a" stroke-width="6" fill="none" opacity="0.85"/>

  <!-- sân trước, hàng rào sắt, cổng mở hé -->
  <rect x="0" y="665" width="540" height="85" fill="#9a8c5a"/>
  <g stroke="#2b2b2b" stroke-width="3">
    <line x1="0" y1="705" x2="190" y2="705"/><line x1="350" y1="705" x2="540" y2="705"/>
    <line x1="10" y1="705" x2="10" y2="745"/><line x1="40" y1="705" x2="40" y2="745"/><line x1="70" y1="705" x2="70" y2="745"/><line x1="100" y1="705" x2="100" y2="745"/><line x1="130" y1="705" x2="130" y2="745"/><line x1="160" y1="705" x2="160" y2="745"/>
    <line x1="380" y1="705" x2="380" y2="745"/><line x1="410" y1="705" x2="410" y2="745"/><line x1="440" y1="705" x2="440" y2="745"/><line x1="470" y1="705" x2="470" y2="745"/><line x1="500" y1="705" x2="500" y2="745"/><line x1="530" y1="705" x2="530" y2="745"/>
  </g>
  <rect x="185" y="690" width="10" height="60" fill="#2b2b2b"/><rect x="345" y="690" width="10" height="60" fill="#2b2b2b"/>
  <polygon points="195,700 245,712 245,750 195,750" fill="none" stroke="#2b2b2b" stroke-width="3"/>
  <!-- biển bất động sản SOLD -->
  <line x1="420" y1="760" x2="420" y2="690" stroke="#5b3a26" stroke-width="5"/>
  <rect x="395" y="660" width="80" height="45" fill="#f4efe6" stroke="#5b3a26" stroke-width="3"/>
  <polygon points="395,690 395,705 475,672 475,660 465,660" fill="#c0392b"/>

  <!-- vỉa hè + đường -->
  <rect x="0" y="750" width="540" height="40" fill="#bdb3a5"/>
  <rect x="0" y="790" width="540" height="170" fill="#6f6a66"/>

  <!-- VÙNG NHÂN VẬT + UI -->
  <rect class="zone" x="20" y="560" width="200" height="390" rx="8"/>
  <text x="120" y="900" text-anchor="middle" class="lbl" fill="#1f5f8b">NORA + VALI</text>
  <text x="120" y="918" text-anchor="middle" class="note">(nửa người, đứng trước cổng)</text>
  <rect class="zone" x="20" y="20" width="300" height="80" rx="8"/>
  <text x="170" y="55" text-anchor="middle" class="lbl" fill="#1f5f8b">TIN NHẮN ĐIỆN THOẠI</text>
  <text x="170" y="73" text-anchor="middle" class="note">"No refunds. Good luck." (code)</text>

  <!-- CHÚ THÍCH -->
  <g>
    <rect class="tag" x="355" y="100" width="175" height="34" rx="5"/>
    <text x="362" y="114" class="note" font-weight="bold">Biển HOTEL trên nóc</text>
    <text x="362" y="128" class="note">nghiêng, rơi chữ "O", đèn tắt</text>
    <path class="lead" d="M 355 120 L 340 140"/>

    <rect class="tag" x="160" y="200" width="150" height="34" rx="5"/>
    <text x="167" y="214" class="note" font-weight="bold">5 tầng, đối xứng</text>
    <text x="167" y="228" class="note">2 tháp tròn ở góc</text>

    <rect class="tag" x="345" y="400" width="185" height="48" rx="5"/>
    <text x="352" y="414" class="note" font-weight="bold">Hàng cửa sổ giống nhau</text>
    <text x="352" y="428" class="note">= nhiều phòng. Vài ô vỡ /</text>
    <text x="352" y="442" class="note">đóng ván, 1 ô hắt đèn vàng</text>

    <rect class="tag" x="300" y="490" width="230" height="34" rx="5"/>
    <text x="307" y="504" class="note" font-weight="bold">Lối vào lớn: cửa kép + mái che đỏ</text>
    <text x="307" y="518" class="note">rách; bậc thềm rộng; 2 đèn cột</text>
    <path class="lead" d="M 360 524 L 330 545"/>

    <rect class="tag" x="400" y="770" width="130" height="34" rx="5"/>
    <text x="407" y="784" class="note" font-weight="bold">Biển SOLD</text>
    <text x="407" y="798" class="note">băng đỏ chéo, không chữ</text>

    <rect class="tag" x="240" y="820" width="170" height="34" rx="5"/>
    <text x="247" y="834" class="note" font-weight="bold">Cổng sắt gỉ mở hé</text>
    <text x="247" y="848" class="note">hàng rào, vỉa hè, đường</text>
    <path class="lead" d="M 260 820 L 230 745"/>
  </g>

  <text x="530" y="950" text-anchor="end" class="note" fill="#fff">#1 BG-exterior-dusk · phác thảo bố cục 9:16 · 09/11</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" font-family="Arial, sans-serif">
  <style>
    .line{stroke:#2f2a26;stroke-width:2}
    .note{font-size:11px;fill:#333}
    .lbl{font-size:13px;font-weight:bold}
    .tag{fill:#fffbe6;stroke:#c0392b;stroke-width:1.5}
    .lead{stroke:#c0392b;stroke-width:1.5;fill:none}
    .board{fill:none;stroke:#2c7fb8;stroke-width:2.5;stroke-dasharray:9 5}
    .cell{fill:none;stroke:#bfe1f7;stroke-width:0.8;opacity:0.5}
  </style>

  <!-- ===== NỀN SẢNH: bố cục đầy đủ như bản 1 ===== -->
  <rect width="540" height="960" fill="#3a2e2a"/>
  <polygon points="0,0 540,0 540,330 0,330" fill="#7a3b3f"/>
  <g stroke="#5c2a2e" stroke-width="2" opacity="0.6">
    <line x1="30" y1="0" x2="30" y2="330"/><line x1="90" y1="0" x2="90" y2="330"/><line x1="150" y1="0" x2="150" y2="330"/><line x1="210" y1="0" x2="210" y2="330"/><line x1="270" y1="0" x2="270" y2="330"/><line x1="330" y1="0" x2="330" y2="330"/><line x1="390" y1="0" x2="390" y2="330"/><line x1="450" y1="0" x2="450" y2="330"/>
  </g>
  <polygon points="60,40 110,60 95,120 50,95" fill="#a8857a" opacity="0.7"/>
  <polygon points="0,330 540,330 540,960 0,960" fill="#9c7448"/>
  <g stroke="#7b5a36" stroke-width="2" opacity="0.7">

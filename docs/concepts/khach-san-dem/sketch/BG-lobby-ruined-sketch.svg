  <rect x="340" y="728" width="75" height="34" rx="6" fill="#4f6b5a" stroke="#2f2a26" stroke-width="2"/>
  <ellipse cx="455" cy="790" rx="30" ry="12" fill="#a0446a" stroke="#2f2a26" stroke-width="2"/>
  <rect x="425" y="768" width="60" height="22" fill="#a0446a" stroke="#2f2a26" stroke-width="2"/>
  <circle cx="360" cy="778" r="7" fill="#e8c46a"/><circle cx="395" cy="745" r="6" fill="#d98a6a"/>


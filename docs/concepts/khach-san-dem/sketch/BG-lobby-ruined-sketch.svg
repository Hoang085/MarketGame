  <path d="M 30 420 Q 40 380 85 385 Q 125 390 120 440 L 115 470 L 35 470 Z" fill="#ece6dc" class="line"/>
  <path d="M 100 470 Q 110 440 150 445 Q 180 450 175 490 L 170 505 L 105 505 Z" fill="#ece6dc" class="line"/>


  <rect x="215" y="850" width="40" height="28" fill="#efe4cf" stroke="#2f2a26" transform="rotate(-12 235 864)"/>
  <rect x="262" y="872" width="34" height="24" fill="#efe4cf" stroke="#2f2a26" transform="rotate(10 279 884)"/>
  <rect x="300" y="830" width="28" height="32" fill="#7a7a7a" stroke="#2f2a26"/>
  <ellipse cx="314" cy="866" rx="40" ry="9" fill="#8fb3c4" opacity="0.5"/>

  <!-- ===== LỚP PHỦ: bàn ghép 7×7 trượt lên che nền (không thuộc ảnh nền) ===== -->
  <rect class="board" x="12" y="400" width="516" height="550" rx="10"/>
  <g>
    <rect class="cell" x="22" y="430" width="70" height="70"/><rect class="cell" x="94" y="430" width="70" height="70"/><rect class="cell" x="166" y="430" width="70" height="70"/><rect class="cell" x="238" y="430" width="70" height="70"/><rect class="cell" x="310" y="430" width="70" height="70"/><rect class="cell" x="382" y="430" width="70" height="70"/><rect class="cell" x="454" y="430" width="70" height="70"/>
    <rect class="cell" x="22" y="502" width="70" height="70"/><rect class="cell" x="94" y="502" width="70" height="70"/><rect class="cell" x="166" y="502" width="70" height="70"/><rect class="cell" x="238" y="502" width="70" height="70"/><rect class="cell" x="310" y="502" width="70" height="70"/><rect class="cell" x="382" y="502" width="70" height="70"/><rect class="cell" x="454" y="502" width="70" height="70"/>
    <rect class="cell" x="22" y="574" width="70" height="70"/><rect class="cell" x="94" y="574" width="70" height="70"/><rect class="cell" x="166" y="574" width="70" height="70"/><rect class="cell" x="238" y="574" width="70" height="70"/><rect class="cell" x="310" y="574" width="70" height="70"/><rect class="cell" x="382" y="574" width="70" height="70"/><rect class="cell" x="454" y="574" width="70" height="70"/>
    <rect class="cell" x="22" y="646" width="70" height="70"/><rect class="cell" x="94" y="646" width="70" height="70"/><rect class="cell" x="166" y="646" width="70" height="70"/><rect class="cell" x="238" y="646" width="70" height="70"/><rect class="cell" x="310" y="646" width="70" height="70"/><rect class="cell" x="382" y="646" width="70" height="70"/><rect class="cell" x="454" y="646" width="70" height="70"/>
    <rect class="cell" x="22" y="718" width="70" height="70"/><rect class="cell" x="94" y="718" width="70" height="70"/><rect class="cell" x="166" y="718" width="70" height="70"/><rect class="cell" x="238" y="718" width="70" height="70"/><rect class="cell" x="310" y="718" width="70" height="70"/><rect class="cell" x="382" y="718" width="70" height="70"/><rect class="cell" x="454" y="718" width="70" height="70"/>
    <rect class="cell" x="22" y="790" width="70" height="70"/><rect class="cell" x="94" y="790" width="70" height="70"/><rect class="cell" x="166" y="790" width="70" height="70"/><rect class="cell" x="238" y="790" width="70" height="70"/><rect class="cell" x="310" y="790" width="70" height="70"/><rect class="cell" x="382" y="790" width="70" height="70"/><rect class="cell" x="454" y="790" width="70" height="70"/>
    <rect class="cell" x="22" y="862" width="70" height="70"/><rect class="cell" x="94" y="862" width="70" height="70"/><rect class="cell" x="166" y="862" width="70" height="70"/><rect class="cell" x="238" y="862" width="70" height="70"/><rect class="cell" x="310" y="862" width="70" height="70"/><rect class="cell" x="382" y="862" width="70" height="70"/><rect class="cell" x="454" y="862" width="70" height="70"/>
  </g>
  <rect x="95" y="404" width="350" height="22" rx="4" fill="rgba(20,40,60,0.75)"/>
  <text x="270" y="420" text-anchor="middle" class="lbl" fill="#e6f2fa">BÀN GHÉP 7×7: lớp phủ, che phần dưới nền</text>

  <!-- ===== CHÚ THÍCH ===== -->
  <g>
    <rect class="tag" x="155" y="8" width="215" height="48" rx="5"/>
    <text x="162" y="22" class="note" font-weight="bold">Tủ chìa khóa nhiều ô số phòng</text>
    <text x="162" y="36" class="note">thẻ đồng, vài ô trống; biển RECEPTION</text>
    <text x="162" y="50" class="note">mất chữ = dấu hiệu khách sạn số 1</text>
    <path class="lead" d="M 200 56 L 190 82"/>

    <rect class="tag" x="5" y="345" width="175" height="34" rx="5"/>
    <text x="12" y="359" class="note" font-weight="bold">Quầy lễ tân dài ở trung tâm</text>
    <text x="12" y="373" class="note">chuông đồng + sổ khách</text>

    <rect class="tag" x="345" y="60" width="140" height="34" rx="5"/>
    <text x="352" y="74" class="note" font-weight="bold">Thang máy cổ</text>
    <text x="352" y="88" class="note">cửa lưới + kim chỉ tầng</text>

    <rect class="tag" x="395" y="372" width="140" height="22" rx="5"/>
    <text x="402" y="387" class="note" font-weight="bold">Cầu thang, cửa sổ: PHỤ</text>

    <!-- chú thích tiền cảnh -->
    <rect class="tag" x="150" y="580" width="240" height="22" rx="5"/>
    <text x="157" y="595" class="note" font-weight="bold">Huy hiệu khách sạn khảm giữa sàn</text>

    <rect class="tag" x="20" y="790" width="180" height="34" rx="5"/>
    <text x="27" y="804" class="note" font-weight="bold">Ghế sofa tròn kiểu khách sạn</text>
    <text x="27" y="818" class="note">phủ vải; bản đêm Nora ngồi đây</text>

    <rect class="tag" x="300" y="690" width="160" height="22" rx="5"/>
    <text x="307" y="705" class="note" font-weight="bold">Vali cũ + hộp mũ bỏ lại</text>

    <rect class="tag" x="360" y="560" width="175" height="34" rx="5"/>
    <text x="367" y="574" class="note" font-weight="bold">Giá treo: áo choàng + mũ chóp</text>
    <text x="367" y="588" class="note">gợi ý trước khách đêm</text>

    <rect class="tag" x="130" y="900" width="210" height="22" rx="5"/>
    <text x="137" y="915" class="note" font-weight="bold">Thư, báo cũ; xô hứng nước dột</text>

    <rect class="tag" x="380" y="935" width="150" height="20" rx="5"/>
    <text x="386" y="949" class="note" font-weight="bold">Dây chắn nhung bị đổ</text>
    <rect class="tag" x="5" y="845" width="110" height="20" rx="5"/>
    <text x="11" y="859" class="note" font-weight="bold">Cây cọ chậu héo</text>
  </g>

  <text x="530" y="956" text-anchor="end" class="note" fill="#fff">#2 BG-lobby-ruined · phác thảo v4 (nền đầy đủ + tiền cảnh, bàn 7×7 phủ lên) · 09/11</text>

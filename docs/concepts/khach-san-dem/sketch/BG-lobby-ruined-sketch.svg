  <path d="M 330 610 L 360 640 L 352 670 L 380 700" stroke="#4a3320" stroke-width="2" fill="none"/>
  <polygon points="405,720 470,705 478,722 412,737" fill="#7b5a36" stroke="#4a3320"/>

  <!-- ghế sofa tròn giữa sảnh (kiểu khách sạn), phủ vải; bản đã sửa Nora ngồi ở đây -->
  <ellipse cx="160" cy="745" rx="95" ry="30" fill="#d9d2c6" stroke="#2f2a26" stroke-width="2"/>
  <path d="M 70 745 Q 75 690 160 685 Q 245 690 250 745" fill="#ece6dc" stroke="#2f2a26" stroke-width="2"/>
  <path d="M 120 690 Q 160 650 200 690" fill="#e2dbcf" stroke="#2f2a26" stroke-width="2"/>

  <!-- chồng vali cũ + hộp mũ, bỏ lại từ khách xưa -->

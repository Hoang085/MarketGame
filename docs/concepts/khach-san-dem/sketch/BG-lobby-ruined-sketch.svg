  <path d="M 40 300 Q 185 270 330 300 L 330 350 Q 185 320 40 350 Z" fill="#8a5a3a" class="line"/>
  <path d="M 40 300 Q 185 270 330 300" stroke="#c9a14a" stroke-width="4" fill="none"/>
  <circle cx="200" cy="283" r="7" fill="#d4a63a" class="line"/>
  <rect x="235" y="278" width="34" height="10" fill="#efe4cf" class="line" transform="rotate(-6 252 283)"/>

  <!-- thang máy cổ -->
  <rect x="360" y="120" width="80" height="185" fill="#6b5a3a" class="line"/>
  <rect x="368" y="135" width="30" height="165" fill="#3a3326" stroke="#c9a14a" stroke-width="2"/>
  <rect x="402" y="135" width="30" height="165" fill="#3a3326" stroke="#c9a14a" stroke-width="2"/>
  <g stroke="#c9a14a" stroke-width="1"><line x1="368" y1="150" x2="398" y2="290"/><line x1="398" y1="150" x2="368" y2="290"/><line x1="402" y1="150" x2="432" y2="290"/><line x1="432" y1="150" x2="402" y2="290"/></g>
  <path d="M 375 115 A 25 25 0 0 1 425 115" fill="#c9a14a" stroke="#2f2a26" stroke-width="2"/>
  <line x1="400" y1="115" x2="388" y2="98" stroke="#2f2a26" stroke-width="2"/>

  <!-- cầu thang phụ + cửa sổ vòm -->
  <polygon points="455,330 540,250 540,330" fill="#6b4a2c" class="line"/>
  <g stroke="#2f2a26" stroke-width="1.5"><line x1="470" y1="316" x2="540" y2="316"/><line x1="485" y1="302" x2="540" y2="302"/><line x1="500" y1="288" x2="540" y2="288"/><line x1="515" y1="274" x2="540" y2="274"/></g>
  <path d="M 470 230 L 470 120 A 30 30 0 0 1 530 120 L 530 230 Z" fill="#f2d59a" class="line"/>
  <polygon points="470,230 530,230 420,520 300,520" fill="#f6dfa8" opacity="0.25"/>

  <!-- đồng hồ quả lắc -->
  <rect x="8" y="150" width="26" height="160" fill="#5b3a26" class="line"/>
  <circle cx="21" cy="172" r="10" fill="#efe4cf" class="line"/>

  <!-- thảm đỏ rách -->
  <polygon points="150,960 300,960 255,350 195,350" fill="#8e2a2a" opacity="0.85"/>
  <polygon points="215,700 260,690 250,760 205,745" fill="#9c7448"/>

  <!-- đèn chùm rơi -->
  <g transform="rotate(25 300 420)">
    <ellipse cx="300" cy="420" rx="42" ry="16" fill="#e8eef2" stroke="#c9a14a" stroke-width="2"/>
    <g stroke="#cfe3ee" stroke-width="2"><line x1="265" y1="425" x2="262" y2="455"/><line x1="285" y1="430" x2="284" y2="465"/><line x1="305" y1="432" x2="306" y2="468"/><line x1="325" y1="428" x2="328" y2="458"/></g>
  </g>


  </g>

  <!-- tủ chìa khóa -->
  <rect x="95" y="105" width="180" height="125" fill="#5b3a26" class="line"/>
  <g fill="#3e2718" stroke="#c9a14a" stroke-width="1">
    <rect x="105" y="115" width="30" height="24"/><rect x="140" y="115" width="30" height="24"/><rect x="175" y="115" width="30" height="24"/><rect x="210" y="115" width="30" height="24"/><rect x="245" y="115" width="22" height="24"/>
    <rect x="105" y="145" width="30" height="24"/><rect x="140" y="145" width="30" height="24"/><rect x="175" y="145" width="30" height="24"/><rect x="210" y="145" width="30" height="24"/><rect x="245" y="145" width="22" height="24"/>
    <rect x="105" y="175" width="30" height="24"/><rect x="140" y="175" width="30" height="24"/><rect x="175" y="175" width="30" height="24"/><rect x="210" y="175" width="30" height="24"/><rect x="245" y="175" width="22" height="24"/>
  </g>
  <g fill="#c9a14a"><circle cx="120" cy="134" r="3"/><circle cx="190" cy="134" r="3"/><circle cx="155" cy="164" r="3"/><circle cx="225" cy="194" r="3"/></g>
  <rect x="120" y="82" width="130" height="18" fill="#3e2718" stroke="#c9a14a"/>
  <text x="185" y="96" text-anchor="middle" font-size="11" fill="#8c7a5a" letter-spacing="2">RECEP  ION</text>


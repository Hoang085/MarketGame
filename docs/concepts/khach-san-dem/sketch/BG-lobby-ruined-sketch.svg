  <line x1="480" y1="760" x2="530" y2="760" stroke="#3e2718" stroke-width="6"/>
  <path d="M 492 615 L 518 615 L 528 700 L 482 700 Z" fill="#1d1a24" stroke="#2f2a26"/>
  <rect x="490" y="588" width="30" height="24" fill="#1d1a24"/><rect x="484" y="610" width="42" height="5" fill="#1d1a24"/>

